# Render Blueprint — deploys BOTH services from this repository.
# Render dashboard → New → Blueprint → pick the repo → Apply.
#
#   math3d-api  Node web service (backend/)  → https://math3d-api.onrender.com
#   math3d-web  Static site      (frontend/) → https://math3d-web.onrender.com
#
# Render subdomains are global: if a name is taken, Render adds a suffix
# (e.g. math3d-api-x1y2.onrender.com). Then update the two URLs below
# (API_BASE_URL and ALLOWED_ORIGINS) in the dashboard and redeploy.
services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: math3d-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Stable HMAC secret so tokens survive restarts / free-tier sleeps.
      - key: GAME_SECRET
        generateValue: true
      # The static site's public URL (comma-separate several, no trailing slash).
      - key: ALLOWED_ORIGINS
        value: https://math3d-web.onrender.com
      # localhost / LAN origins may call the API (local dev against production).
      - key: ALLOW_LOCAL_ORIGINS
        value: "true"

  # --------------------------------------------------------------- frontend
  - type: web
    name: math3d-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Baked into dist/js/env.js at build time (see frontend/scripts/build.mjs).
      - key: API_BASE_URL
        value: https://math3d-api.onrender.com
    headers:
      # No content hashes in file names → always revalidate (ETag ⇒ cheap 304s).
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
